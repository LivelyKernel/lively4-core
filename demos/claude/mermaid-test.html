<!DOCTYPE html>
<html>
<head>
    <title>Mermaid Test</title>
</head>
<body>
    <h1>Mermaid Rendering Test</h1>
    
    <!-- Method 1: Direct HTML with mermaid class -->
    <div class="mermaid">
        graph TD
            A[CLI npm run test-single] --> B[Puppeteer]
            B --> C[Headless Chrome]
            C --> D[Lively4 Environment]
            D --> E[SystemJS + Babel]
            E --> F[Test Module Loading]
            F --> G[Mocha Execution]
            G --> H[Results Back to CLI]
    </div>

    <!-- Method 2: Script-based rendering -->
    <div id="mermaid-manual"></div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js">
    <script>
        // Check if mermaid loaded
        if (typeof mermaid === 'undefined') {
            document.body.innerHTML += '<p style="color: red;">Error: Mermaid library failed to load!</p>';
        } else {
            console.log('Mermaid loaded successfully');
            
            // Initialize Mermaid
            mermaid.initialize({ 
                startOnLoad: true,
                theme: 'default'
            });

            // Manual rendering example
            const diagram = `
            graph LR
                A[Start] --> B{Decision}
                B -->|Yes| C[Action 1]
                B -->|No| D[Action 2]
            `;
            
            // Render to specific element
            mermaid.render('manual-diagram', diagram).then(({svg}) => {
                document.getElementById('mermaid-manual').innerHTML = svg;
            }).catch(err => {
                console.error('Mermaid render error:', err);
                document.getElementById('mermaid-manual').innerHTML = '<p style="color: red;">Mermaid render failed: ' + err.message + '</p>';
            });
        }
    </script>
</body>
</html>
