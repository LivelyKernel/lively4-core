<template id="lively-change-watcher">
<style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
<style data-src="/templates/livelystyle.css"></style>
<style>
:host {
  display: block;
  width: 400px;
  height: 500px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 4px;
  overflow: hidden;
}

.header {
  background: #f5f5f5;
  padding: 8px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.status {
  font-weight: bold;
  font-size: 14px;
}

.controls {
  display: flex;
  gap: 5px;
}

.controls button {
  padding: 4px 8px;
  font-size: 12px;
  border: 1px solid #ccc;
  border-radius: 3px;
  background: white;
  cursor: pointer;
}

.controls button:hover {
  background: #f0f0f0;
}

.changes-container {
  height: calc(100% - 60px);
  overflow-y: auto;
  padding: 8px;
}

.change-item {
  display: flex;
  padding: 4px 0;
  border-bottom: 1px solid #eee;
  font-family: monospace;
  font-size: 12px;
}

.event-type {
  width: 70px;
  font-weight: bold;
  text-align: center;
  padding: 2px 4px;
  border-radius: 3px;
  margin-right: 8px;
}

.event-type.create {
  background: #d4edda;
  color: #155724;
}

.event-type.delete {
  background: #f8d7da;
  color: #721c24;
}

.event-type.change {
  background: #d1ecf1;
  color: #0c5460;
}

.path {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-right: 8px;
}

a.path.clickable {
  color: #007bff;
  cursor: pointer;
  text-decoration: underline;
}

a.path.clickable:hover {
  color: #0056b3;
  background-color: #f8f9fa;
}

.time {
  color: #666;
  font-size: 11px;
  min-width: 70px;
  text-align: right;
}

.empty-message {
  text-align: center;
  color: #666;
  margin-top: 50px;
  font-style: italic;
}

.change-item.no-container {
  opacity: 0.6;
  background-color: #f9f9f9;
}

.change-item.no-container .path {
  color: #999;
}
</style>

<div class="header">
  <div class="status">
    Status: <span id="status">Initializing...</span>
  </div>
  <div class="controls">
    <button id="clearButton" title="Clear change history">Clear</button>
    <button id="reconnectButton" title="Reconnect to file watcher">Reconnect</button>
  </div>
</div>

<div class="changes-container">
  <div id="changesList">
    <div class="empty-message">No file changes detected yet</div>
  </div>
</div>

</template>
