<template id="lively-class-diagram">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      display: block;
      width: fit-content;
      height: fit-content;
      background: white;
      overflow: visible;
    }
    
    #diagram {
      width: fit-content;
      height: fit-content;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
    }
    
    .mermaid {
      background: white;
    }
    
    /* Use Virgil font for hand-drawn style diagrams */
    #diagram.hand-drawn svg {
      font-family: Virgil, sans-serif;
    }
  </style>
  
  <div id="diagram" class="mermaid">
    classDiagram
      class Empty {
        +info() String
      }
  </div>
</template>
