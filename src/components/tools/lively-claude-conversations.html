<template id="lively-claude-conversations">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 10px;
      background: white;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }

    .controls label {
      font-weight: bold;
      color: #333;
    }

    .controls select {
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .controls button {
      padding: 8px 15px;
      background: #007cba;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .controls button:hover {
      background: #005a8b;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .graph-container {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: auto;
      background: white;
      min-height: 400px;
      position: relative;
    }

    .error-message {
      padding: 20px;
      color: #d32f2f;
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 5px;
      margin: 10px 0;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>

  <div class="controls">
    <label for="projectSelect">Project:</label>
    <select id="projectSelect">
      <option value="">Loading...</option>
    </select>
    <button id="loadButton">Load Conversations</button>
  </div>

  <div class="stats" id="stats" style="display: none;">
    <span id="messageCount">Messages: 0</span>
    <span id="sessionCount">Sessions: 0</span>
    <span id="conversationCount">Conversations: 0</span>
  </div>

  <div class="loading" id="loading">
    <div>Loading messages...</div>
  </div>

  <div class="graph-container" id="graphContainer">
    <div style="text-align: center; padding: 50px; color: #999;">
      Select a project and click "Load Conversations" to visualize message flows
    </div>
  </div>
</template>
