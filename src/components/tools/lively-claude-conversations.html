<template id="lively-claude-conversations">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: white;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    .controls label {
      font-weight: bold;
      color: #333;
    }

    .controls select {
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .controls button {
      padding: 8px 15px;
      background: #007cba;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .controls button:hover {
      background: #005a8b;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .main-content {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    
    .conversations-panel {
      width: 300px;
      flex-shrink: 0;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    
    .conversations-header {
      padding: 10px 15px;
      background: #f8f9fa;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
      color: #333;
    }
    
    .conversations-list {
      flex: 1;
      overflow-y: auto;
      padding: 5px;
    }
    
    .conversation-item {
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 5px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .conversation-item:hover {
      background: #f0f0f0;
      border-color: #ccc;
    }
    
    .conversation-item.selected {
      background: #e3f2fd;
      border-color: #007cba;
    }
    
    .conversation-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 4px;
    }
    
    .conversation-meta {
      font-size: 12px;
      color: #666;
    }
    
    .empty-conversations {
      padding: 20px;
      text-align: center;
      color: #999;
      font-style: italic;
    }
    
    .graph-panel {
      flex: 1;
      position: relative;
    }

    .error-message {
      padding: 20px;
      color: #d32f2f;
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 5px;
      margin: 10px 0;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-left: 10px;
      font-size: 14px;
      color: #666;
    }

    #graphContainer {
      height: 100%;
    }
  </style>

  <div class="controls">
    <label for="projectSelect">Project:</label>
    <select id="projectSelect">
      <option value="">Loading...</option>
    </select>
    <button id="loadButton">Load Conversations</button>
    
    <div class="stats" id="stats" style="display: none;">
      <span id="messageCount">Messages: 0</span>
      <span id="sessionCount">Sessions: 0</span>
      <span id="conversationCount">Conversations: 0</span>
    </div>
  </div>

  <div class="loading" id="loading">
    <div>Loading messages...</div>
  </div>

  <div class="main-content">
    <div class="conversations-panel">
      <div class="conversations-header">Conversations</div>
      <div class="conversations-list" id="conversationsList"></div>
    </div>
    
    <div class="graph-panel">
      <div id="graphContainer"></div>
    </div>
  </div>
</template>
