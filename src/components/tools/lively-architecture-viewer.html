<template id="lively-architecture-viewer">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    
    #pane {
      position: absolute; 
      top: 0px; left: 0px; 
      overflow-x: auto; 
      overflow-y: auto; 
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #f5f5f5;
      /* Ensure panning works everywhere */
      touch-action: none;
    }
  </style>
  
  <!-- Pane for panning - Panning class will listen to this -->
  <div id="pane">
    <slot></slot>
  </div>
</template>
