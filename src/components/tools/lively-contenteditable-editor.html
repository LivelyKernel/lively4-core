<template id="lively-contenteditable-editor">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    #editor-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 10px;
      box-sizing: border-box;
      background: transparent;
    }
    
    ::slotted([slot="editor"]) {
      display: block;
      min-height: 100%;
      outline: none;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
    }
    
    #changeIndicator {
      width: 10px;
      height: 10px;
      border-radius: 5px;
      background-color: rgb(200,200,200);
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 100;
    }
  </style>
  
  <div id="editor-container">
    <!-- Slot for light DOM contenteditable (created in JS for Grammarly compatibility) -->
    <slot name="editor"></slot>
  </div>
  <div id="changeIndicator"></div>
</template>
