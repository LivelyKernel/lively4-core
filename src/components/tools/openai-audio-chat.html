<template id="openai-audio-chat">
  <style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    #editor {
      max-height: calc(100%);
      flex: 1; 
    }
    #pane {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    } 
    #player {
      float: right
    }
    #quality {
      width: 80px;
    }
    #textInput {
      padding:15px;
      background-color:white;
      border: 1px solid lightgray;
      border-radius: 10px;
      width: calc(100% - 100px);
      bottom: 20px;
      position: absolute;
      margin-left: 35px;
      margin-right: 35px
    }
    #recordButton {
      padding:14px;
      background-color: white;
      border: 1px solid lightgray;
      border-radius: 10px;
      bottom: 15px;
      position: absolute;
      right: 35px;
      background:transparent;
      border:none;
      font-size: 20px
    }
    
    :host(.recording)  #recordButton {
      border: 4px solid red;
    }

    
    #resetButton {
      border-radius: 100px
    }
    
    #buttonBar {
      width: 100%;
      border: 1px solid gray;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      box-sizing: border-box;
      flex-wrap: wrap;
    }

    #voiceBox, #modelBox {
      min-width: 120px;
      flex: 0 1 auto;
    }

    #player {
      flex: 1 1 auto;
      min-width: 150px;
      max-width: 300px;
    }

    #streamingToggle {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
      cursor: pointer;
    }

    #streamingToggle:hover {
      background: #f5f5f5;
    }

    #streamingCheckbox {
      cursor: pointer;
    }

    .streaming-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .streaming-indicator {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      min-width: 50px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .streaming-indicator .circle::before {
      content: "⚪"; /* Gray circle when not active */
    }

    .streaming-indicator .label {
      color: #999;
    }

    :host(.streaming-mode) .streaming-indicator .circle::before {
      content: "🟢"; /* Green circle when streaming but not listening */
    }

    :host(.streaming-mode) .streaming-indicator .label {
      color: #00cc00;
    }

    :host(.listening) .streaming-indicator .circle::before {
      content: "🔴"; /* Red circle when actively listening */
      animation: pulse 1s ease-in-out infinite;
    }

    :host(.listening) .streaming-indicator .label {
      color: #ff0000;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    :host(.streaming-mode) #textInput {
      background-color: #f0f8ff;
    }
    
    #responses {
      list-style-type: none;
      width: calc(100% - 50px);
      height: calc(100% - 140px) ;
      overflow-y: scroll;
      top: 40px;
      position: absolute;
    }
    
    #responses li.user {
      background: #F3F3F3;
      border-radius: 10px;
      padding: 2px;
      padding-right: 10px;
      padding-left: 10px;
      
    }
    
    #responses li.system {
      
    }
    
    #pane {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0px;
      left: 0px
    }
  </style>
  <div id="pane" style=" ">
    <ul id="responses"></ul>
    <div id="buttonBar">
      <button id="resetButton">🔄</button>
      <input-combobox id="voiceBox"></input-combobox>
      <input-combobox id="modelBox"></input-combobox>
      <audio id="player" controls="true"></audio>
      <div class="streaming-controls">
        <label id="streamingToggle">
          <input type="checkbox" id="streamingCheckbox"> Real-time Mode
        </label>
        <span class="streaming-indicator">
          <span class="circle"></span>
          <span class="label">LIVE</span>
        </span>
      </div>
    </div>
  
    <div id="textBar">
      <textarea  id="textInput" type="text" placeholder="Message ChatGPT"></textarea>
      <button id="recordButton">🎤</button>
    </div>
  </div>
</template>
