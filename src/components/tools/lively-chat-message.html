<template id="lively-chat-message">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      position: relative;
      display: block;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      transition: background-color 0.2s;
      box-sizing: border-box;
      width: 800px;
      overflow-x: auto;
    }


    /* Default role-based colors */
    :host([role="user"]) {
      background-color: #e3f2fd;
      border-left: 3px solid #2196f3;
    }

    :host([role="assistant"]) {
      background-color: #f3e5f5;
      border-left: 3px solid #9c27b0;
    }

    /* Assistant messages with tool calls - different color */
    :host([role="assistant"][has-tools]) {
      background-color: #fff3e0;
      border-left: 3px solid #ff9800;
    }

    :host([role="tool"]) {
      background-color: #fff3e0;
      border-left: 3px solid #ff9800;
      cursor: pointer;
    }

    :host([role="tool"]:hover) {
      background-color: #ffe0b2;
    }

    /* OpenCode user messages (voice agent) = green, always */
    :host([role="user"][source="code"]) {
      background-color: #e8f5e9;
      border-left: 3px solid #4caf50;
    }

    .debug-header {
      font-size: 11px;
      color: #666;
      margin-bottom: 5px;
      font-family: monospace;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .debug-header.hidden {
      display: none;
    }

    .debug-item {
      display: inline-block;
    }

    .debug-label {
      font-weight: bold;
      color: #444;
    }

    .content {
      margin: 0;
    }

    .content.collapsed {
      max-height: 100px;
      overflow: hidden;
      position: relative;
    }

    .content.collapsed::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, #fff3e0);
      pointer-events: none;
    }

    .expand-indicator {
      font-size: 10px;
      color: #ff9800;
      font-weight: bold;
      margin-top: 5px;
      text-align: center;
    }

    lively-markdown {
      display: block;
    }
    
    button#inspect {
      
      font-size:6pt;
      padding: 2pt;
    }

    button#viewRawButton {
      
      font-size: 6pt;
      padding: 2pt;
    }

    .raw-display {
      margin-top: 10px;
      padding: 10px;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 3px;
      overflow-x: auto;
    }

    .raw-display pre {
      margin: 0;
      font-family: monospace;
      font-size: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 500px;
    }

  </style>

  <div id="container">
    <button id="inspect" class="debug" >inspect</button>
    <button id="viewRawButton" class="debug">View Raw</button>
    <div id="debugHeader" class="debug-header debug"></div>
    <div id="content" class="content">
      <lively-markdown></lively-markdown>
    </div>
    <div id="rawDisplay" class="raw-display debug" style="display:none">
      <pre id="rawJson"></pre>
    </div>
    <div id="expandIndicator" class="expand-indicator" style="display: none;"></div>
  </div>
</template>
