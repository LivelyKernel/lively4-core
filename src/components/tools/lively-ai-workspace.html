<template id="lively-ai-workspace">
<style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
<style data-src="/templates/livelystyle.css"></style>
<style>
:host {
  display: block;
  width: 1200px;
  height: 700px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 4px;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 12px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h3 {
  margin: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-bar {
  display: flex;
  gap: 20px;
  font-size: 13px;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff6b6b;
}

.status-dot.connected {
  background: #51cf66;
}

.status-dot.working {
  background: #ffd93d;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.main-layout {
  display: flex;
  height: calc(100% - 50px);
}

.sessions-sidebar {
  width: 220px;
  border-right: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  background: #f8f9fa;
  overflow: hidden;
}

.sidebar-header {
  padding: 10px 12px;
  background: #e9ecef;
  border-bottom: 1px solid #dee2e6;
  font-weight: 600;
  font-size: 13px;
  color: #495057;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sessions-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

.chat-section {
  flex: 1;
  border-right: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.opencode-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.section-header {
  padding: 10px 12px;
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
  font-weight: 600;
  font-size: 13px;
  color: #495057;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.section-content openai-realtime-chat,
.section-content lively-opencode {
  width: 100%;
  height: 100%;
  display: block;
}

.blackboard-panel {
  background: #fffef7;
  border-top: 1px solid #e0e0e0;
  padding: 12px;
  font-size: 12px;
  max-height: 150px;
  overflow-y: auto;
}

.blackboard-panel.collapsed {
  max-height: 0;
  padding: 0;
  border: none;
}

.blackboard-header {
  font-weight: 600;
  margin-bottom: 8px;
  color: #495057;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.blackboard-content {
  font-family: monospace;
  white-space: pre-wrap;
  color: #333;
  background: white;
  padding: 8px;
  border-radius: 3px;
  border: 1px solid #e0e0e0;
}

.controls {
  display: flex;
  gap: 8px;
}

.controls button {
  padding: 6px 12px;
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
  transition: background 0.2s;
}

.controls button:hover {
  background: rgba(255,255,255,0.2);
}

.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #6c757d;
}

.placeholder i {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}

.placeholder-text {
  font-size: 14px;
  font-style: italic;
}

/* Sessions List Styles */
.session-item {
  padding: 10px 12px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #e9ecef;
  background: white;
}

.session-item:hover {
  background: #e7f0ff;
}

.session-item.active {
  background: #d0e7ff;
  border-left: 3px solid #667eea;
  padding-left: 9px;
}

.session-item-info {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.session-item-title {
  font-weight: 500;
  color: #333;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.session-item-meta {
  font-size: 11px;
  color: #6c757d;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.session-item-actions {
  display: flex;
  gap: 4px;
  margin-left: 8px;
}

.session-item-actions button {
  padding: 4px 6px;
  font-size: 12px;
  border: none;
  border-radius: 3px;
  background: transparent;
  color: #6c757d;
  cursor: pointer;
  transition: all 0.2s;
}

.session-item-actions button:hover {
  background: rgba(0, 0, 0, 0.05);
  color: #495057;
}

.session-item-actions button.delete:hover {
  background: #fff5f5;
  color: #ff6b6b;
}

.empty-sessions {
  text-align: center;
  padding: 40px 20px;
  color: #6c757d;
  font-style: italic;
}
</style>

<div class="header">
  <h3>
    <i class="fa fa-rocket"></i>
    AI Workspace
  </h3>
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot" id="realtimeDot"></span>
      <span id="realtimeStatus">Realtime: Idle</span>
    </div>
    <div class="status-item">
      <span class="status-dot" id="opencodeDot"></span>
      <span id="opencodeStatus">OpenCode: Idle</span>
    </div>
  </div>
  <div class="controls">
    <button id="newSessionButton" title="Create new session">
      <i class="fa fa-plus"></i> New Session
    </button>
    <button id="exportHistoryButton" title="Export combined chat history">
      <i class="fa fa-download"></i> Export History
    </button>
    <button id="viewHistoryButton" title="View combined chat history">
      <i class="fa fa-history"></i> View History
    </button>
    <!-- Other buttons disabled until fixed -->
    <!--
    <button id="toggleBlackboardButton" title="Toggle blackboard panel">
      <i class="fa fa-list-alt"></i> Blackboard
    </button>
    <button id="clearButton" title="Clear workspace">
      <i class="fa fa-refresh"></i> Clear
    </button>
    -->
  </div>
</div>

<div class="main-layout">
  <div class="sessions-sidebar">
    <div class="sidebar-header">
      <i class="fa fa-list"></i>
      Sessions
    </div>
    <div class="sessions-list" id="sessionsList">
      <!-- Sessions will be populated here -->
    </div>
  </div>

  <div class="chat-section">
    <div class="section-header">
      <i class="fa fa-microphone"></i>
      Realtime Chat
    </div>
    <div class="section-content" id="realtimeContainer">
      <!-- Component created programmatically -->
    </div>
  </div>

  <div class="opencode-section">
    <div class="section-header">
      <i class="fa fa-code"></i>
      OpenCode Agent
    </div>
    <div class="section-content" id="opencodeContainer">
      <!-- Component created programmatically -->
    </div>
  </div>
</div>

<div class="blackboard-panel collapsed" id="blackboardPanel">
  <div class="blackboard-header">
    Coordination State
  </div>
  <div class="blackboard-content" id="blackboardContent">
No active coordination
  </div>
</div>

<content></content>
</template>
