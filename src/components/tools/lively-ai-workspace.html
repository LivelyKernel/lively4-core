<template id="lively-ai-workspace">
<style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
<style data-src="/templates/livelystyle.css"></style>
<style data-src="/src/components/tools/lively-chat.css"></style>
<style>
:host {
  display: block;
  width: 1200px;
  height: 700px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 4px;
  overflow: hidden;
}

  
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 12px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h3 {
  margin: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-bar {
  display: flex;
  gap: 20px;
  font-size: 13px;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff6b6b;
}

.status-dot.connected {
  background: #51cf66;
}

.status-dot.working {
  background: #ffd93d;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.main-layout {
  display: flex;
  height: calc(100% - 50px);
  flex-direction: column;
}

.workspace-content {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sessions component has its own styles */

.shared-messages-pane {
  flex: 1.5;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
  background: #fafafa;
  border-bottom: 1px solid #e0e0e0;
  display: block;
}

.shared-messages-pane lively-chat-message {
  display: block;
  margin-bottom: 5px;
}

/* Component-specific logging panel sizing */
.logging-panel {
  flex: 1;
  border-bottom: 1px solid #e0e0e0;
}

.subchats-container {
  display: flex;
  flex: 0 0 auto;
  min-height: 150px;
  max-height: 200px;
  border-top: 1px solid #e0e0e0;
}

.chat-section {
  flex: 1;
  border-right: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.opencode-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.section-header {
  padding: 10px 12px;
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
  font-weight: 600;
  font-size: 13px;
  color: #495057;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.section-content openai-realtime-chat,
.section-content lively-opencode {
  width: 100%;
  height: 100%;
  display: block;
}


.section-content openai-realtime-chat #messagesContainer,
.section-content lively-opencode #messagesContainer {
  display: none !important;
}

.controls {
  display: flex;
  gap: 8px;
}

.controls button {
  padding: 6px 12px;
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
  transition: background 0.2s;
}

.controls button:hover {
  background: rgba(255,255,255,0.2);
}

.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #6c757d;
}

.placeholder i {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}

.placeholder-text {
  font-size: 14px;
  font-style: italic;
}

/* Sessions List Styles removed - now in lively-chat-sessions component */

:host([hide-code-tools="true"]) lively-chat-message.code-tool {
    display: none;
}

:host([hide-audio-tools="true"]) lively-chat-message.audio-tool {
    display: none;
}

:host([hide-debug-log="true"]) .logging-panel {
    display: none;
}


</style>

<div class="header">
  <h3>
    <i class="fa fa-rocket"></i>
    AI Workspace
  </h3>
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot" id="realtimeDot"></span>
      <span id="realtimeStatus">Realtime: Idle</span>
    </div>
    <div class="status-item">
      <span class="status-dot" id="opencodeDot"></span>
      <span id="opencodeStatus">OpenCode: Idle</span>
    </div>
  </div>
  <div id="replayControlsPlaceholder"></div>
  <div class="controls">
    <button id="newSessionButton" title="Create new session">
      <i class="fa fa-plus"></i> New Session
    </button>
  </div>
</div>

<div class="main-layout">
  <div class="workspace-content">
    <lively-chat-sessions id="sessionsComponent"></lively-chat-sessions>

    <div class="shared-messages-pane" id="sharedMessagesPane">
      <!-- Unified messages from both audio and code sources displayed here -->
    </div>

    <div class="logging-panel" id="loggingPanel">
      <div class="logging-header">
        <span>Debug Log</span>
        <button id="clearLogButton" title="Clear log">
          <i class="fa fa-trash"></i>
        </button>
      </div>
      <ul id="debugLog"></ul>
    </div>
  </div>

  <div class="subchats-container">
    <div class="chat-section">
      <div class="section-header">
        <i class="fa fa-microphone"></i>
        Realtime Chat
      </div>
      <div class="section-content" id="realtimeContainer">
        <!-- Component created programmatically -->
      </div>
    </div>
    <div class="opencode-section">
      <div class="section-header">
        <i class="fa fa-code"></i>
        OpenCode Agent
      </div>
      <div class="section-content" id="opencodeContainer">
        <!-- Component created programmatically -->
      </div>
    </div>
  </div>
  
</div>


<content></content>
</template>
