<template id="lively-chat-replay">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #ccc;
      background-color: #f5f5f5;
    }

    .header h3 {
      margin: 0;
      font-size: 16px;
    }

    .event-counter {
      font-size: 14px;
      color: #666;
    }

    .controls {
      display: flex;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #ccc;
      align-items: center;
    }

    .controls button {
      padding: 5px 10px;
      cursor: pointer;
    }

    .controls select {
      padding: 5px;
    }

    .events-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #eventsList {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
      border-right: 1px solid #ccc;
    }

    #details {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background-color: #fafafa;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    #details:empty::before {
      content: "Click an event to view details";
      color: #999;
      font-style: italic;
    }

    .event-item {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .event-item:hover {
      background-color: #f9f9f9;
    }

    .event-item.replayed {
      background-color: #f0f0f0;
      opacity: 0.7;
    }

    .event-item.current {
      background-color: #e3f2fd;
      border-left: 4px solid #2196f3;
      opacity: 1;
    }

    .event-item.selected {
      background-color: #fff3e0;
      border-left: 4px solid #ff9800;
    }

    .event-line1 {
      font-family: monospace;
      font-size: 12px;
      color: #333;
      margin-bottom: 4px;
    }

    .event-line2 {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-index {
      color: #999;
      margin-right: 8px;
    }

    .event-timestamp {
      color: #666;
      margin-right: 8px;
    }

    .event-type {
      color: #2196f3;
      margin-right: 8px;
    }

    .event-source {
      color: #4caf50;
    }
  </style>

  <div class="header">
    <h3>Replay Events</h3>
    <div class="event-counter">
      Event <span id="currentIndex">0</span> / <span id="totalEvents">0</span>
    </div>
  </div>

  <div class="controls">
    <button id="rewindButton">⏮ Rewind</button>
    <button id="playPauseButton">▶ Play</button>
    <button id="stepForwardButton">⏭ Step Forward</button>
    <button id="stopButton">⏹ Stop</button>
    <select id="speedSelect">
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="5">5x</option>
      <option value="0">Instant</option>
    </select>
  </div>

  <div class="events-container">
    <ul id="eventsList" class="events-list">
      <!-- Event items will be rendered here -->
    </ul>
    <div id="details"></div>
  </div>
</template>
