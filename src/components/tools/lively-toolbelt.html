<template id="lively-toolbelt" >
  <style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
  <style data-src="/templates/livelystyle.css"></style>
  <style data-src="/src/components/tools/lively-tool-panel.css"></style>
  <style>
    :host {
      position: fixed;
      display: flex;
      justify-content: center;
      
      left: 0;
      right: 0;
      bottom: 0;
      
      z-index: 1001;
      pointer-events: none;
      
      --padding: 8px;
      /* --accent-color now comes from the shared lively-tool-panel.css */
      --transition-time: 1300ms;
      --transition-tween: ease;
    }
    
    #wrapper {
      /*   background: green; */
      pointer-events: auto;

      height: 50px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    :host(:hover) #wrapper,
    :host(.pinned) #wrapper {
      height: 70px;
    }

    /* Animated hover buffer flanking the container. The pseudo-elements are flex items
       of #wrapper and inherit its pointer-events:auto, so they enlarge the hover catch
       area (and the tinted background) by a dynamic, animated amount on each side.
       With the wrapper no longer fixed-width, these pad widths define the buffer. */
    #wrapper::before,
    #wrapper::after {
      content: '';
      align-self: stretch;
      width: 100px;
    }
    
    #container {
      box-sizing: border-box;
      
      display: flex;
      position: relative;
      
      overflow: hidden;
      
      margin: 0 auto;
      width: 100px;
      height: 10px;
      bottom: 5px;
      
      background-color: rgba(255, 255, 255, .3);
      border-radius: .8125rem;
      box-shadow: 0px 0px .5px rgba(0,0,0,.18);
      border: .1px solid color-mix(in rgba, lightgray 50%, transparent);
      transition:
        width var(--transition-time) var(--transition-tween),
        height var(--transition-time) var(--transition-tween),
        background-color var(--transition-time) var(--transition-tween),
        border-radius var(--transition-time) var(--transition-tween),
        box-shadow var(--transition-time) var(--transition-tween),
        border var(--transition-time) var(--transition-tween),
        bottom var(--transition-time) var(--transition-tween),
        transform var(--transition-time) var(--transition-tween);
    }
    
    :host(:hover) #container,
    :host(.pinned) #container {
      /*   background: blue; */
      width: var(--w);
      height: var(--h);
      
      background-color: white;
      border-radius: .8125rem;
      box-shadow: 0px 0px .5px rgba(0,0,0,.18), 0px 3px 8px rgba(0,0,0,.1), 0px 1px 3px rgba(0,0,0,.1), inset 0px .5px 0px rgba(0,0,0,.08), inset 0px 0px .5px rgba(0,0,0,.1);
      border: .3px solid darkgray;
      bottom: 12px;
    }
    
    #inner {
      /*   height: 48px; */
      display: flex;
      gap: .5rem;
      padding: var(--padding);
      /* size to content instead of stretching to #container's (animated) height, so the
         JS measurement of #inner stays independent of --h and can't feed back / grow.
         flex-start (not center) keeps the content top-anchored so the collapsed ~10px
         container clips it to empty padding rather than revealing the icon glyphs. */
      align-self: flex-start;
    }
    /* Vertical stack: secondary actions panel above the main bar. */
    #stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Secondary actions panel (undo/redo/…). Revealed only outside normal mode
       (the `mode` attribute is unset in normal mode). grid-template-rows 0fr->1fr
       animates the height smoothly to the real content size — max-height would
       clip the content and make it pop in at the end. The inner panel fades and
       slides in parallel. */
    #actions {
      display: grid;
      grid-template-rows: 0fr;
      margin-bottom: 0;
      transition:
        grid-template-rows var(--transition-time) var(--transition-tween),
        margin-bottom var(--transition-time) var(--transition-tween);
    }
    .actions-clip {
      overflow: hidden;
      min-height: 0;
    }
    .actions-panel {
      display: flex;
      gap: .25rem;
      padding: var(--padding);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      background-color: white;
      border-radius: .8125rem;
      box-shadow: 0px 0px .5px rgba(0,0,0,.18), 0px 3px 8px rgba(0,0,0,.1), 0px 1px 3px rgba(0,0,0,.1);
      border: .3px solid darkgray;
      transition:
        opacity var(--transition-time) var(--transition-tween),
        transform var(--transition-time) var(--transition-tween);
    }
    :host([mode]:hover) #actions,
    :host([mode].pinned) #actions {
      grid-template-rows: 1fr;
      margin-bottom: 8px;
    }
    :host([mode]:hover) .actions-panel,
    :host([mode].pinned) .actions-panel {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    button:disabled {
      opacity: .35;
      cursor: default;
    }
    button:disabled:hover {
      background: none;
    }

    .tool-group {
      display: flex;
      gap: 1px;
    }
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000e5;
      border-radius: .3125rem;
      box-shadow: none;
      outline: none;
      
      margin: 0;
      letter-spacing: inherit;
      text-align: inherit;
      border: none;
      background: none;
      
      width: 2rem;
      &.more {
        width: 16px;
      }
      height: 2rem;
      
      &:hover {
        background: #f5f5f5;
        /*     border:green solid 2px; */
      }
      
      .fa {
        display: flex;
        align-items: center;
        justify-content: center;
        justify-items: center;
      }
      
    }
    
    .divider {
      width: 1px;
      background: darkgray;
    }

    :host(.pinned) #pin {
      background: var(--accent-color);
      color: white;
    }

    /* Highlight the active mode with the same color as the pinned pin. The
       active mode lives in the host's mode attribute (radio group); not set
       means normal, so normal is lit whenever no drawing mode is active. */
    #mode-normal {
      background: var(--accent-color);
      color: white;
    }
    :host([mode='freeform']) #mode-normal,
    :host([mode='rectangle']) #mode-normal,
    :host([mode='arrow']) #mode-normal,
    :host([mode='eraser']) #mode-normal,
    :host([mode='select']) #mode-normal {
      background: none;
      color: #000000e5;
    }

    /* Active drawing mode + the independent audio toggle (.audio), which can
       be lit at the same time as any mode. */
    :host([mode='freeform']) #mode-freeform,
    :host([mode='rectangle']) #mode-rectangle,
    :host([mode='arrow']) #mode-arrow,
    :host([mode='eraser']) #mode-eraser,
    :host([mode='select']) #mode-select,
    :host(.audio) #audio-mode {
      background: var(--accent-color);
      color: white;
    }

    /* Hide the inner content while the toolbelt is minified (not hovered / pinned). */
    #inner > * {
      opacity: 0;
      transition: opacity var(--transition-time) var(--transition-tween);
    }
    :host(:hover) #inner > *,
    :host(.pinned) #inner > * {
      opacity: 1;
    }
  </style>
  <div id='wrapper'>
    <div id='stack'>
      <div id='actions'>
        <div class='actions-clip'>
          <div class='actions-panel'>
            <button id="undo" title='Undo (Z)' disabled><i class='fa fa-undo'></i></button>
            <button id="redo" title='Redo (Y)' disabled><i class='fa fa-repeat'></i></button>
            <span class='divider'></span>
            <button id="delete-selection" title='Delete (coming soon)' disabled><i class='fa fa-trash-o'></i></button>
            <button id="duplicate-selection" title='Duplicate (select something first)' disabled><i class='fa fa-clone'></i></button>
            <span class='divider'></span>
            <button id="more-actions" title='More (coming soon)' disabled><i class='fa fa-ellipsis-v'></i></button>
          </div>
        </div>
      </div>
      <div id='container'>
      <div id='inner'>
        <div class='tool-group modes'>
          <button id="mode-normal" title='Normal Mode (N)'><i class='fa fa-mouse-pointer'></i></button>
          <button id="mode-freeform" title='Freeform Drawing (F)'><i class='fa fa-pencil'></i></button>
          <button id="more-brush" class='more' title='Brush Presets'><i class='fa fa-angle-down'></i></button>
          <button id="mode-rectangle" title='Rectangle (R)'><i class='fa fa-square-o'></i></button>
          <button id="mode-arrow" title='Arrow (A)'><i class='fa fa-long-arrow-right'></i></button>
          <button id="mode-eraser" title='Eraser (E)'><i class='fa fa-eraser'></i></button>
          <button id="mode-select" title='Select (S)'><i class='fa fa-circle-o-notch'></i></button>
          <button id="more-select" class='more' title='Selection Shape'><i class='fa fa-angle-down'></i></button>
        </div>
        <button id="audio-mode" title='Audio Mode'><i class='fa fa-microphone'></i></button>
        <button id="ai" title='AI Assistant'><i class='fa fa-magic'></i></button>
        <span class='divider'></span>
        <button id="data-loader" title='Data Loader'><i class='fa fa-download'></i></button>
        <div class='tool-group'>
          <button id="viewer" title='V2 WebGPU Viewer'><i class='fa fa-desktop'></i></button>
          <button id="more-viewers" class='more' title='More Viewers'><i class='fa fa-angle-down'></i></button>
        </div>
        <span class='divider'></span>
        <button id="performance-panel" title='Performance Panel'><i class='fa fa-area-chart'></i></button>
        <div class='tool-group'>
          <button id="performance-load-tester" title='Notification Events Receiver'><i class='fa fa-list'></i></button>
          <button id="more-performance" class='more' title='More Benchmark and Introspection Tools'><i class='fa fa-angle-down'></i></button>
        </div>
        <div class='tool-group'>
          <button id="own-code" title='My Code'><i class='fa fa-code'></i></button>
          <button id="more-code" class='more' title='More Code'><i class='fa fa-angle-down'></i></button>
        </div>
        <span class='divider'></span>
        <button id="pin" title='Pin Toolbelt'><i class='fa fa-thumb-tack'></i></button>
      </div>
      </div>
    </div>
  </div>
</template>
