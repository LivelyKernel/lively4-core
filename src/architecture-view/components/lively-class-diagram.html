<template id="lively-class-diagram">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      display: block;
      width: fit-content;
      height: fit-content;
      background: white;
      overflow: visible;
    }
    
    #diagram {
      width: fit-content;
      height: fit-content;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
    }
    
    .mermaid {
      background: white;
    }
    
    #diagram.hand-drawn svg {
      font-family: Virgil, sans-serif;
    }
    
    /* Hashtag method name styling */
    .hashtag-important {
      font-weight: bold !important;
    }
    
    .hashtag-deprecated {
      text-decoration: line-through !important;
      opacity: 0.6;
    }
    
    .hashtag-private {
      font-style: italic !important;
    }
    
    /* Hashtag label colors */
    .method-hashtags {
      fill: #888;
      font-size: 10px;
      font-family: monospace;
    }
    
    .hashtag-label-important {
      fill: #d32f2f !important;
    }
    
    .hashtag-label-deprecated {
      fill: #9e9e9e !important;
    }
    
    .hashtag-label-private {
      fill: #757575 !important;
    }
    
    .hashtag-label-TODO {
      fill: #f9a825 !important;
    }
    
    .hashtag-label-public-api,
    .hashtag-label-api {
      fill: #1976d2 !important;
    }
    
    .hashtag-label-experimental {
      fill: #f57c00 !important;
    }
  </style>
  
  <div id="diagram" class="mermaid">
    classDiagram
      class Empty {
        +info() String
      }
  </div>
</template>
