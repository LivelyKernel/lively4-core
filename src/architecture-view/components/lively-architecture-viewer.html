<template id="lively-architecture-viewer">
  <style data-src="/templates/livelystyle.css"></style>
  <style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
  <style data-src="/src/external/highlight.css"></style>
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    
    #pane {
      position: absolute; 
      top: 0px; left: 0px; 
      overflow-x: auto; 
      overflow-y: auto; 
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #f5f5f5;
      /* Ensure panning works everywhere */
      touch-action: none;
      /* #pane is already a positioning context (position: absolute) for #details */
    }
    
    #details {
      position: absolute;
      font-family: monospace;
      font-size: 10pt;
      background-color: white;
      border: 2px solid #666;
      border-radius: 4px;
      padding: 10px;
      max-width: 780px;
      max-height: 400px;
      overflow: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 1000;
      display: none;
    }
    
    #details.visible {
      display: block;
    }
    
    #details .details-header {
      font-weight: bold;
      padding-bottom: 5px;
      border-bottom: 1px solid #ccc;
      margin-bottom: 10px;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #details .details-title {
      flex: 1;
    }
    
    #details #browse {
      margin-left: 10px;
    }
    
    #details .details-source {
      font-size: 9pt;
      line-height: 1.4;
      white-space: pre;
    }
    
    #details .details-source pre {
      margin: 0;
      padding: 0;
    }
    
    #details .details-comments {
      padding: 8px 12px;
      background-color: #f8f9fa;
      border-left: 3px solid #1e90ff;
      margin-bottom: 12px;
      font-size: 13px;
    }
    
    #details .details-comments pre {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #555;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
  
  <!-- Pane for panning - Panning class will listen to this -->
  <div id="pane">
    <slot></slot>
    <!-- Details pane inside pane so it scrolls/zooms with diagram -->
    <div id="details"></div>
  </div>
</template>
