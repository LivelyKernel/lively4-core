<template id="openai-realtime-chat">
  <style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
  <style data-src="/templates/livelystyle.css"></style>
  <style data-src="/src/ai-workspace/components/lively-chat.css"></style>
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    #editor {
      max-height: calc(100%);
      flex: 1;
    }
    #pane {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    } 
    #player {
      float: right
    }
    #quality {
      width: 80px;
    }
    #textInputContainer {
      border-top: 1px solid #e0e0e0;
      padding: 12px;
      background: #f8f9fa;
      display: flex;
      gap: 8px;
    }

    #textInput {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      max-height: 200px;
    }

    #textInput:focus {
      outline: none;
      border-color: #4a90e2;
    }
    #resetButton, #stopButton {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 14px;
    }

    #resetButton:hover, #stopButton:hover {
      background: #f5f5f5;
    }

    #stopButton {
      background: #ffebee;
      border-color: #f44336;
      flex: 1;
    }

    #stopButton:hover {
      background: #ffcdd2;
    }

    :host(.stopped) #stopButton {
      background: #e8f5e9;
      border-color: #4caf50;
    }

    :host(.stopped) #stopButton:hover {
      background: #c8e6c9;
    }
    
    #buttonBar {
      width: 100%;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #f8f9fa;
      min-height: 60px;
    }

    #voiceBox {
      min-width: 120px;
      margin-left: auto;
    }

    #modelBox {
      min-width: 150px;
    }

    #vadTypeBox {
      min-width: 140px;
    }

    #vadEagernessBox {
      min-width: 100px;
    }

    #vadThresholdContainer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    #vadThresholdSlider {
      width: 80px;
    }

    #vadThresholdValue {
      min-width: 35px;
      font-weight: 500;
      color: #333;
    }

    #mainContent {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #contentArea {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    #messagesContainer {
      list-style-type: none;
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      margin: 0;
      min-height: 0;
      background: white;
    }

    #messagesContainer li.user {
      background: #F3F3F3;
      border-radius: 10px;
      padding: 2px;
      padding-right: 10px;
      padding-left: 10px;
      margin-left: auto;
      margin-right: 0;
      max-width: 80%;
      width: fit-content;
      font-style: italic;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    #messagesContainer li.assistant {
      background: #E3F2FD;
      border-radius: 10px;
      padding: 2px;
      padding-right: 10px;
      padding-left: 10px;
      max-width: 80%;
    }

    #messagesContainer li.system {

    }

    #messagesContainer li.tool {
      background: #E8F4F8;
      border-left: 3px solid #4A90A4;
      border-radius: 5px;
      padding: 4px;
      padding-right: 8px;
      padding-left: 8px;
      margin: 4px 0;
      font-size: 0.9em;
      color: #2C5F6F;
    }

    /* Conversations UI moved to lively-chat-sessions component */

    /* Sessions sidebar wrapper - use width not flex-basis so lively-separator can resize it */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 250px;
      min-width: 80px;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* Hide debug headers by default, show only when attribute is present */
    :host(:not([show-debug-annotations])) .debug-header {
      display: none;
    }

    /* Hide tool messages by default, show only when attribute is present */
    :host(:not([show-tool-calls])) #messagesContainer li.tool {
      display: none;
    }

    #statusBar {
      display: none;
      padding: 8px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      color: #856404;
    }

    #statusBar.connecting {
      display: block;
      background: #fff3cd;
      border-color: #ffc107;
      color: #856404;
    }

    #statusBar.ready {
      display: block;
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    #statusBar.listening {
      display: block;
      background: #d1ecf1;
      border-color: #17a2b8;
      color: #0c5460;
    }

    /* Hide sessions sidebar when session-ui is explicitly set to false */
    :host([session-ui="false"]) .sidebar, :host([session-ui="false"]) #resetButton {
      display: none;
    }

    /* Hide message list when messages-ui is explicitly set to false (but keep text input) */
    :host([messages-ui="false"]) #messagesContainer {
      display: none;
    }

    /* Component-specific logging panel sizing - use width not flex-basis so lively-separator can resize it */
    .logging-panel {
      width: 600px;
      flex-shrink: 0;
    }

    :host([hide-debug-log="true"]) .logging-panel {
      display: none;
    }

    /* Hide logging panel when logging-ui is explicitly set to false */
    :host([logging-ui="false"]) .logging-panel {
      display: none;
    }

    /* Tool Settings Modal */
    #toolSettingsModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 2px solid #4a90e2;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 10000;
      min-width: 400px;
      max-width: 500px;
    }

    #toolSettingsModal.visible {
      display: block;
    }

    #toolSettingsOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9999;
    }

    #toolSettingsOverlay.visible {
      display: block;
    }

    .tool-settings-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e0e0e0;
    }

    .tool-setting-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      background: #f8f9fa;
    }

    .tool-setting-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .tool-setting-item label {
      cursor: pointer;
      flex: 1;
      font-size: 14px;
    }

    .tool-setting-description {
      font-size: 12px;
      color: #666;
      margin-left: 26px;
      margin-top: -8px;
      margin-bottom: 12px;
    }

    .tool-settings-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
    }

    .tool-settings-footer button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    .tool-settings-footer button:hover {
      background: #f5f5f5;
    }

    .tool-settings-footer button.primary {
      background: #4a90e2;
      color: white;
      border-color: #4a90e2;
    }

    .tool-settings-footer button.primary:hover {
      background: #357abd;
    }

    #toolSettingsButton {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      border-radius: 5px;
      font-size: 14px;
    }

    #toolSettingsButton:hover {
      background: #f5f5f5;
    }
  </style>
  <div id="pane" style=" ">
    <div id="statusBar"></div>
    <div id="buttonBar">
      <button id="stopButton">⏹️ Stop</button>
      <button id="resetButton">🆕 New</button>
      <input-combobox id="voiceBox"></input-combobox>
      <input-combobox id="modelBox"></input-combobox>
      <input-combobox id="vadTypeBox"></input-combobox>
      <input-combobox id="vadEagernessBox"></input-combobox>
      <div id="vadThresholdContainer">
        <label for="vadThresholdSlider">Threshold:</label>
        <input type="range" id="vadThresholdSlider" min="0" max="1" step="0.05" />
        <span id="vadThresholdValue">0.85</span>
      </div>
      <button id="toolSettingsButton" title="Configure tool permissions">
        🔧 Tools
      </button>
      <div id="replayControlsPlaceholder"></div>
      <div style="width:20px">
      </div>
    </div>

    <div id="mainContent">
      <div class="sidebar">
        <lively-chat-sessions id="sessionsComponent"></lively-chat-sessions>
      </div>
      <lively-separator></lively-separator>

      <div id="contentArea">
        <ul id="messagesContainer"></ul>
        <div id="textInputContainer">
          <textarea id="textInput" type="text" placeholder="Type a message..."></textarea>
        </div>
      </div>
      <lively-separator reverse="true"></lively-separator>

      <div class="logging-panel" id="loggingPanel">
        <div class="logging-header">
          <span>Debug Log</span>
          <button id="clearLogButton" title="Clear log">
            <i class="fa fa-trash"></i>
          </button>
        </div>
        <ul id="debugLog"></ul>
      </div>
    </div>

    <!-- Tool Settings Modal -->
    <div id="toolSettingsOverlay"></div>
    <div id="toolSettingsModal">
      <div class="tool-settings-header">
        Configure Tool Permissions for Vox
      </div>
      <div id="toolSettingsContent">
        <div class="tool-setting-item">
          <input type="checkbox" id="allowCodeEvaluation" />
          <label for="allowCodeEvaluation">Allow Code Evaluation</label>
        </div>
        <div class="tool-setting-description">
          Enables Vox to execute JavaScript code in the Lively4 environment
        </div>

        <div class="tool-setting-item">
          <input type="checkbox" id="allowOpenCodeTasks" />
          <label for="allowOpenCodeTasks">Allow OpenCode Tasks</label>
        </div>
        <div class="tool-setting-description">
          Enables Vox to send coding tasks to the OpenCode agent (Scribe)
        </div>

        <div class="tool-setting-item">
          <input type="checkbox" id="allowMessageInspection" />
          <label for="allowMessageInspection">Allow Message Inspection</label>
        </div>
        <div class="tool-setting-description">
          Enables Vox to retrieve and search through conversation history
        </div>

        <div class="tool-setting-item">
          <input type="checkbox" id="allowVoiceFileTools" />
          <label for="allowVoiceFileTools">Allow Voice File Tools</label>
        </div>
        <div class="tool-setting-description">
          Enables Vox to read files and list recent files during voice conversations
        </div>
      </div>
      <div class="tool-settings-footer">
        <button id="cancelToolSettings">Cancel</button>
        <button id="saveToolSettings" class="primary">Save</button>
      </div>
    </div>
  </div>
</template>
