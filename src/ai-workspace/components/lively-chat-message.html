<template id="lively-chat-message">
  <style data-src="/templates/livelystyle.css"></style>
  <style>
    :host {
      position: relative;
      display: block;
      margin: 10px 0;
      box-sizing: border-box;
      width: 800px;
      overflow-x: visible;
      overflow-y: visible;
    }

    #shell {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: start;
      width: 100%;
    }

    .selection-gutter {
      display: flex;
      justify-content: center;
      padding-top: 12px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transition: opacity 0.16s ease;
    }

    :host(:hover) .selection-gutter,
    :host([selected]) .selection-gutter,
    :host([selection-mode]) .selection-gutter,
    :host(:focus-within) .selection-gutter {
      opacity: 1;
      pointer-events: auto;
    }

    .selection-control {
      position: relative;
      display: inline-flex;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .selection-checkbox {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .selection-checkmark {
      width: 18px;
      height: 18px;
      border: 2px solid #b9c0c8;
      border-radius: 4px;
      background: white;
      box-sizing: border-box;
      transition: border-color 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
      position: relative;
    }

    .selection-checkmark::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border-right: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(45deg) scale(0);
      transform-origin: center;
      transition: transform 0.12s ease;
    }

    .selection-control:hover .selection-checkmark {
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.12);
    }

    .selection-checkbox:checked + .selection-checkmark {
      background: #4a90e2;
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.18);
    }

    .selection-checkbox:checked + .selection-checkmark::after {
      transform: rotate(45deg) scale(1);
    }

    #container {
      position: relative;
      min-width: 0;
      padding: 10px;
      border-radius: 5px;
      box-sizing: border-box;
      transition: background-color 0.2s, box-shadow 0.18s ease, transform 0.18s ease;
    }

    :host([selected]) #container {
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.35);
      user-select: none;
      -webkit-user-select: none;
    }


    /* Default role-based colors */
    :host([role="user"]) #container {
      background-color: #e3f2fd;
      border-left: 3px solid #2196f3;
    }

    :host([role="assistant"]) #container {
      background-color: #f3e5f5;
      border-left: 3px solid #9c27b0;
    }

    /* Assistant messages with tool calls - different color */
    :host([role="assistant"][has-tools]) #container {
      background-color: #fff3e0;
      border-left: 3px solid #ff9800;
    }

    :host([role="tool"]) #container {
      background-color: #fff3e0;
      border-left: 3px solid #ff9800;
    }

    /* System messages (special voice-agent system notifications) */
    :host([role="system"]) #container {
      background-color: #f0f4fa;
      border-left: 3px solid #607d8b;
      font-style: italic;
      opacity: 0.9;
    }

    :host([role="tool"]:hover) #container {
      background-color: #ffe0b2;
    }

    /* OpenCode user messages (voice agent) = green, always */
    :host([role="user"][source="code"]) #container {
      background-color: #e8f5e9;
      border-left: 3px solid #4caf50;
    }

    /* Error messages - red regardless of role */
    :host([has-error]) #container {
      background-color: #ffebee;
      border-left: 3px solid #f44336;
    }

    .debug-header {
      font-size: 11px;
      color: #666;
      margin-bottom: 5px;
      font-family: monospace;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .debug-header.hidden {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .debug-item {
      display: inline-block;
    }

    .debug-label {
      font-weight: bold;
      color: #444;
    }

    .content {
      margin: 0;
    }





    lively-markdown {
      display: block;
    }

    .parts-container {
      display: block;
    }

    .parts-container > * {
      display: block;
    }

    .plain-text-content {
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    button#inspect {
      
      font-size:6pt;
      padding: 2pt;
    }

    button#viewRawButton {
      
      font-size: 6pt;
      padding: 2pt;
    }

    .raw-display {
      margin-top: 10px;
      padding: 10px;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 3px;
      overflow-x: auto;
    }

    .raw-display pre {
      margin: 0;
      font-family: monospace;
      font-size: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 500px;
    }
    
    /* Usage stats panel - positioned to the right, outside the message border */
    .usage-stats {
      position: absolute;
      left: 100%;
      top: 0;
      margin-left: 8px;
      width: 140px;
      font-size: 9px;
      font-family: monospace;
      color: #555;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 3px;
      padding: 4px 6px;
      line-height: 1.6;
      white-space: nowrap;
    }

    .usage-stats.hidden {
      display: none;
    }

    .usage-stats .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .usage-stats .stat-label {
      color: #888;
    }

    .usage-stats .stat-value {
      font-weight: bold;
      color: #333;
    }

    .usage-stats .stat-section {
      border-top: 1px solid #eee;
      margin-top: 3px;
      padding-top: 3px;
    }

    .usage-stats .cost-display {
      border-top: 1px solid #ccc;
      margin-top: 4px;
      padding-top: 4px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      color: #222;
    }

    /* Compact tool call styling */
    details.compact-tool-call {
      margin: 5px 0;
      padding: 0;
      border: none;
    }
    
    details.compact-tool-call summary {
      cursor: pointer;
      padding: 4px 8px;
      background-color: #f5f5f5;
      border-radius: 3px;
      font-size: 13px;
      line-height: 1.4;
    }
    
    details.compact-tool-call summary:hover {
      background-color: #eeeeee;
    }
    
    details.compact-tool-call[open] summary {
      border-bottom: 1px solid #ddd;
      border-radius: 3px 3px 0 0;
      margin-bottom: 8px;
    }

    .compact-tool-inline {
      margin: 5px 0;
      padding: 4px 8px;
      background-color: #f5f5f5;
      border-radius: 3px;
      font-size: 13px;
      line-height: 1.4;
    }
    
    /* Inline diff styling */
    .inline-diff {
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      padding: 8px;
      background-color: #f8f9fa;
      border-radius: 3px;
      border: 1px solid #e0e0e0;
    }
    
    /* Override diff-match-patch's default colors with our plain style */
    .inline-diff ins {
      background-color: #d4edda !important;
      text-decoration: none;
    }
    
    .inline-diff del {
      background-color: #f8d7da !important;
      text-decoration: none;
    }

    /* System context block - collapsible injected context in user messages */
    details.system-context-block {
      margin: 0 0 6px 0;
      border: 1px solid #b0c4de;
      border-radius: 3px;
      background: #f0f4fa;
    }

    details.system-context-block summary {
      cursor: pointer;
      padding: 4px 8px;
      font-size: 11px;
      color: #4a6fa5;
      font-style: italic;
      user-select: none;
      list-style: none;
    }

    details.system-context-block summary::-webkit-details-marker {
      display: none;
    }

    details.system-context-block summary::before {
      content: '▶ ';
      font-style: normal;
    }

    details.system-context-block[open] summary::before {
      content: '▼ ';
    }

    details.system-context-block summary:hover {
      background: #dde8f8;
      border-radius: 3px 3px 0 0;
    }

    details.system-context-block[open] summary {
      border-bottom: 1px solid #b0c4de;
      border-radius: 3px 3px 0 0;
      margin-bottom: 0;
    }

    details.system-context-block lively-markdown {
      padding: 4px 10px 6px;
      font-size: 12px;
      display: block;
    }

    /* System reminder block - project focus context shown after user message */
    details.system-reminder-block {
      margin: 6px 0 0 0;
      border: 1px solid #b0c4de;
      border-radius: 3px;
      background: #f0f4fa;
    }

    details.system-reminder-block summary {
      cursor: pointer;
      padding: 4px 8px;
      font-size: 11px;
      color: #4a6fa5;
      font-style: italic;
      user-select: none;
      list-style: none;
    }

    details.system-reminder-block summary::-webkit-details-marker {
      display: none;
    }

    details.system-reminder-block summary::before {
      content: '▶ ';
      font-style: normal;
    }

    details.system-reminder-block[open] summary::before {
      content: '▼ ';
    }

    details.system-reminder-block summary:hover {
      background: #dde8f8;
      border-radius: 3px 3px 0 0;
    }

    details.system-reminder-block[open] summary {
      border-bottom: 1px solid #b0c4de;
      border-radius: 3px 3px 0 0;
      margin-bottom: 0;
    }

    details.system-reminder-block lively-markdown {
      padding: 4px 10px 6px;
      font-size: 12px;
      display: block;
    }

    /* Legacy project context block - same styling for backward compatibility */
    details.project-context-block {
      margin: 0 0 6px 0;
      border: 1px solid #b0c4de;
      border-radius: 3px;
      background: #f0f4fa;
    }

    details.project-context-block summary {
      cursor: pointer;
      padding: 4px 8px;
      font-size: 11px;
      color: #4a6fa5;
      font-style: italic;
      user-select: none;
      list-style: none;
    }

    details.project-context-block summary::-webkit-details-marker {
      display: none;
    }

    details.project-context-block summary::before {
      content: '▶ ';
      font-style: normal;
    }

    details.project-context-block[open] summary::before {
      content: '▼ ';
    }

    details.project-context-block summary:hover {
      background: #dde8f8;
      border-radius: 3px 3px 0 0;
    }

    details.project-context-block[open] summary {
      border-bottom: 1px solid #b0c4de;
      border-radius: 3px 3px 0 0;
      margin-bottom: 0;
    }

    details.project-context-block lively-markdown {
      padding: 4px 10px 6px;
      font-size: 12px;
      display: block;
    }

    /* ── Interactive question tool UI ───────────────────────────────────── */

    .question-tool-interactive {
      border: 2px solid #4a90e2;
      border-radius: 6px;
      padding: 12px 14px;
      background: #f0f6ff;
      margin: 6px 0;
    }

    .question-block {
      margin-bottom: 12px;
    }

    .question-header {
      font-weight: bold;
      font-size: 13px;
      color: #1a4e8a;
      margin-bottom: 4px;
    }

    .question-text {
      font-size: 13px;
      color: #333;
      margin-bottom: 8px;
    }

    .question-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .question-option {
      padding: 5px 12px;
      font-size: 12px;
      border: 1px solid #4a90e2;
      border-radius: 4px;
      background: white;
      color: #4a90e2;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .question-option:hover {
      background: #d0e8ff;
    }

    .question-option.selected {
      background: #4a90e2;
      color: white;
    }

    .question-custom-input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }

    .question-custom-input:focus {
      outline: none;
      border-color: #4a90e2;
    }

    .question-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #cce0ff;
    }

    .question-submit {
      padding: 6px 16px;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .question-submit:hover {
      background: #357abd;
    }

    .question-submit:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .question-dismiss {
      padding: 6px 12px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: transparent;
      color: #888;
      cursor: pointer;
    }

    .question-dismiss:hover {
      color: #c0392b;
      border-color: #c0392b;
    }

    .question-submitted {
      color: #555;
      font-style: italic;
      font-size: 12px;
    }

  </style>

  <div id="shell">
    <div id="selectionGutter" class="selection-gutter">
      <label id="selectionControl" class="selection-control" title="Select message">
        <input id="selectionCheckbox" class="selection-checkbox" type="checkbox" aria-label="Select message">
        <span class="selection-checkmark"></span>
      </label>
    </div>
    <div id="container">
      <button id="inspect" class="debug" >inspect</button>
      <button id="viewRawButton" class="debug">View Raw</button>
      <div id="debugHeader" class="debug-header debug"></div>
      <div id="content" class="content">
        <div id="partsContainer" class="parts-container"></div>
      </div>
      <div id="rawDisplay" class="raw-display debug" style="display:none">
        <pre id="rawJson"></pre>
      </div>
      <div id="usageStats" class="usage-stats hidden"></div>
    </div>
  </div>
</template>
