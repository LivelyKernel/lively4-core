<template id="lively-ai-workspace">
<style data-src="/src/external/font-awesome/css/font-awesome.css"></style>
<style data-src="/templates/livelystyle.css"></style>
<style data-src="/src/ai-workspace/components/lively-chat.css"></style>
<style>
:host {
  display: block;
  width: 1200px;
  height: 700px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 4px;
  overflow: hidden;
}

  
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 12px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h3 {
  margin: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-bar {
  display: flex;
  gap: 20px;
  font-size: 13px;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff6b6b;
}

.status-dot.connected {
  background: #51cf66;
}

.status-dot.working {
  background: #ffd93d;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.main-layout {
  display: flex;
  height: calc(100% - 50px);
  flex-direction: column;
}

.workspace-content {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sessions sidebar wrapper - use width not flex-basis so lively-separator can resize it */
.sidebar {
  display: flex;
  flex-direction: column;
  width: 200px;
  min-width: 80px;
  flex-shrink: 0;
  overflow: hidden;
}

/* Prompt selector - matching OpenCode style */
.prompt-selector {
  background: #f8f9fa;
  border-right: 1px solid #e0e0e0;
  border-bottom: 1px solid #e0e0e0;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.prompt-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #495057;
}

.prompt-controls {
  display: flex;
  gap: 4px;
  align-items: stretch;
}

.prompt-selector input-combobox {
  flex: 1;
}

.prompt-selector input-combobox input {
  width: 100%;
  padding: 6px 8px;
  font-size: 12px;
  border: 1px solid #ced4da;
  border-radius: 3px;
}

.prompt-edit-button {
  padding: 6px 10px;
  font-size: 11px;
  border: 1px solid #ced4da;
  border-radius: 3px;
  background: white;
  color: #495057;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.prompt-edit-button:hover {
  background: #e9ecef;
  border-color: #adb5bd;
  color: #212529;
}

.prompt-edit-button i {
  font-size: 12px;
}

.messages-container {
  flex: 1.5;
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
  background: #fafafa;
  border-bottom: 1px solid #e0e0e0;
  display: block;
}

.messages-container lively-chat-message {
  display: block;
  margin-bottom: 5px;
}

/* Component-specific logging panel sizing */
.logging-panel {
  flex: 0 0 600px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-bottom: 1px solid #e0e0e0;
}

/* Panel tabs and content - same structure as opencode */
.panel-tabs {
  display: flex;
  background: #e9ecef;
  border-bottom: 1px solid #dee2e6;
  flex-shrink: 0;
}

.panel-tab {
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  color: #6c757d;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
}

.panel-tab:hover {
  color: #495057;
  background: rgba(0, 0, 0, 0.02);
}

.panel-tab.active {
  color: #4a90e2;
  border-bottom-color: #4a90e2;
  background: white;
}

.panel-content {
  flex: 1;
  overflow: auto;
  display: none;
}

.panel-content.active {
  display: flex;
  flex-direction: column;
}

/* Debug log and board content */
#debugLog {
  margin: 0;
  padding: 8px 12px;
  list-style: none;
  background: white;
}

#agentBoard {
  background: white;
}

.debug-log-actions {
  padding: 8px 12px;
  background: white;
  border-bottom: 1px solid #dee2e6;
  display: flex;
  justify-content: flex-end;
  flex-shrink: 0;
}

.debug-log-actions button {
  padding: 4px 8px;
  font-size: 11px;
  border: none;
  border-radius: 3px;
  background: transparent;
  color: #6c757d;
  cursor: pointer;
  transition: all 0.2s;
}

.debug-log-actions button:hover {
  background: rgba(0, 0, 0, 0.05);
  color: #495057;
}

.subchats-container {
  display: flex;
  flex: 0 0 auto;
  min-height: 100px;
  max-height: 400px;
  border-top: 1px solid #e0e0e0;
}

.chat-section {
  flex: 1;
  border-right: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.opencode-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.section-header {
  padding: 10px 12px;
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
  font-weight: 600;
  font-size: 13px;
  color: #495057;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.section-content openai-realtime-chat,
.section-content lively-opencode {
  width: 100%;
  height: 100%;
  display: block;
}


.section-content openai-realtime-chat #messagesContainer,
.section-content lively-opencode #messagesContainer {
  display: none !important;
}

.controls {
  display: flex;
  gap: 8px;
}

.controls button {
  padding: 6px 12px;
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
  transition: background 0.2s;
}

.controls button:hover {
  background: rgba(255,255,255,0.2);
}

.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #6c757d;
}

.placeholder i {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}

.placeholder-text {
  font-size: 14px;
  font-style: italic;
}

/* Sessions List Styles removed - now in lively-chat-sessions component */

:host([hide-code-tools="true"]) lively-chat-message.code-tool {
    display: none;
}

:host([hide-audio-tools="true"]) lively-chat-message.audio-tool {
    display: none;
}

:host([hide-debug-log="true"]) .logging-panel {
    display: none;
}


</style>

<div class="header">
  <h3>
    <i class="fa fa-rocket"></i>
    AI Workspace
  </h3>
  <div class="status-bar">
    <div class="status-item">
      <span class="status-dot" id="realtimeDot"></span>
      <span id="realtimeStatus">Realtime: Idle</span>
    </div>
    <div class="status-item">
      <span class="status-dot" id="opencodeDot"></span>
      <span id="opencodeStatus">OpenCode: Idle</span>
    </div>
  </div>
  <div id="replayControlsPlaceholder"></div>
  <div class="controls">
  </div>
</div>

<div class="main-layout">
  <div class="workspace-content">
    <div class="sidebar">
      <div class="prompt-selector">
        <label class="prompt-label">Prompt</label>
        <div class="prompt-controls">
          <input-combobox id="promptCombobox"></input-combobox>
          <button class="prompt-edit-button" id="promptEditButton" title="Edit prompt file">
            <i class="fa fa-pencil"></i>
          </button>
        </div>
      </div>
      <lively-chat-sessions id="sessionsComponent"></lively-chat-sessions>
    </div>
    <lively-separator></lively-separator>

    <div class="messages-container" id="messagesContainer">
      <!-- Unified messages from both audio and code sources displayed here -->
    </div>
    <lively-separator></lively-separator>

    <div class="logging-panel" id="loggingPanel">
      <div class="panel-tabs">
        <button class="panel-tab active" id="boardTab">
          Board
        </button>
        <button class="panel-tab" id="debugLogTab">
          Debug Logs
        </button>
      </div>
      
      <div class="panel-content active" id="boardContent">
        <lively-agent-board id="agentBoard"></lively-agent-board>
      </div>
      
      <div class="panel-content" id="debugLogContent">
        <div class="debug-log-actions">
          <button id="clearLogButton" title="Clear log">
            <i class="fa fa-trash"></i> Clear
          </button>
        </div>
        <ul id="debugLog"></ul>
      </div>
    </div>
  </div>

  <lively-separator></lively-separator>

  <div class="subchats-container">
    <div class="chat-section">
      <div class="section-header">
        <i class="fa fa-microphone"></i>
        Realtime Chat
      </div>
      <div class="section-content" id="realtimeContainer">
        <!-- Component created programmatically -->
      </div>
    </div>
    <lively-separator></lively-separator>
    <div class="opencode-section">
      <div class="section-header">
        <i class="fa fa-code"></i>
        OpenCode Agent
      </div>
      <div class="section-content" id="opencodeContainer">
        <!-- Component created programmatically -->
      </div>
    </div>
  </div>
  
</div>


<content></content>
</template>
